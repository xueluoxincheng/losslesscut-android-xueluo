name: Build Release APK

on:
  workflow_dispatch: # 允许你在网页上手动点击触发
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 设置 Java 环境（原作者要求 JDK 21）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      # 3. 设置 Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. 解码 Keystore 签名文件
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore.jks

      # 5. 赋予 gradlew 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 6. 执行打包 (传入签名信息，开启 Release 构建)
      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 注意这里的 -PstoreFile=keystore.jks，对应第一步里的 project.property('storeFile')
          ./gradlew assembleRelease \
            -PstoreFile=keystore.jks \
            -PstorePassword="$ANDROID_KEYSTORE_PASSWORD" \
            -PkeyAlias="$ANDROID_KEY_ALIAS" \
            -PkeyPassword="$ANDROID_KEY_PASSWORD"

      # 7. 上传打好的 APK，方便你下载
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: losslesscut-release-apk
          # 由于开启了混淆和压缩，生成的 Release 包默认在这个路径下
          path: app/build/outputs/apk/release/*.apk

      # 8. 清理敏感文件 (清理掉解码出来的签名文件，保证安全)
      - name: Clean up Keystore
        if: always()
        run: rm -f keystore.jks
